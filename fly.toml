# fly.toml app configuration file generated for forex-ml-monitor on 2026-06-19T12:17:55+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
app = 'forex-ml-monitor'
primary_region = 'fra'

[build]

[env]
  PORT = '5050'
  PYTHONUNBUFFERED = '1'

[[mounts]]
  source = 'signals_data'
  destination = '/app/signals'

[[services]]
  protocol = 'tcp'
  internal_port = 5050
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ['http']
  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    hard_limit = 25
    soft_limit = 20

  [[services.http_checks]]
    interval = '15s'
    timeout = '10s'
    grace_period = '30s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
